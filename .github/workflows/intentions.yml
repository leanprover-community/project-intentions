# Drives the project board from issue events and `claim` / `disclaim` comments, and runs a
# scheduled sweep that releases expired registrations. See
# https://github.com/leanprover-community/intentions for the full command vocabulary.
name: Intentions

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed, reopened]
  schedule:
    # Every 6 hours, offset to avoid the top of the hour. This is the sweep that expires lapsed
    # registrations; GitHub cron is loose, so release lags the schedule by a few minutes.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  intentions:
    permissions:
      issues: write
      pull-requests: write
    uses: leanprover-community/intentions/.github/workflows/intentions.yml@v1
    with:
      project-title: "Project Intentions"   # the exact title of the Projects v2 board
      # This board renames the action's states, so every status option must be mapped explicitly —
      # with the defaults (Unclaimed/Claimed/...) the bot finds no matching option and silently
      # leaves new intentions statusless, unclaimed, and without a recorded expiry.
      status-unclaimed: "Abandoned"          # free to be picked up (fresh, disclaimed, or expired)
      status-claimed: "Planned"              # someone has registered themselves, with an expiry
      status-in-progress: "In Progress"      # work is actively underway
      status-in-review: "In Review"          # under review
      status-completed: "Completed"          # finished or closed
      default-ttl: "90d"                     # three months (the action counts a month as 30 days)
      max-ttl: "180d"                        # six months
      auto-add-labels: "intention"           # only add issues opened via the template (which carries this label)
      claim-on-open: true                    # register from the form alone; no separate `claim` comment
      claim-expiry-field: "Credible expiry date"  # read the auto-claim expiry from this form field
      claim-expiry-require-date: true              # that field must be an absolute date, not a duration
      claim-participants-field: "Participants"     # register listed co-participants alongside the author
      participant-claim: true                # the author and listed participants may claim from any column
      status-commands: true                  # `progress` / `review` / `done` move a card without a PR
      enforce-holder: true                   # the sweep gives every card a column and an owner
      # Cc'd, alongside the issue's author, whenever a claim is declined and on every board repair
      # or participants warning. Deliberately one person: the repository's 30 admins are inherited
      # org-wide and are not all watching this board. Add handles here to widen it.
      notify-maintainers: "faenuccio"
      app-id: ${{ vars.INTENTIONS_BOT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.INTENTIONS_BOT_APP_PRIVATE_KEY }}
